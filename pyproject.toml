[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cross-talker"
version = "0.1.0"
description = "A model-agnostic service for cross-checking prompts across multiple LLM providers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
]

[project.scripts]
cross-talker = "cross_talker.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/cross_talker"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

